<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pen Brush Test</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #111; }
    svg { width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
    #hud {
      position: fixed;
      bottom: 14px;
      left: 14px;
      color: #444;
      font: 11px/1.8 monospace;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <svg id="canvas"></svg>
  <div id="hud">pressure: — &nbsp; twist: —<br>double-click to clear</div>
  <script>
    const svg = document.getElementById('canvas');
    const hud = document.getElementById('hud');
    const NS = 'http://www.w3.org/2000/svg';

    const STAMP_RADIUS = 38;
    const STEP = 6;
    const N = 72; // wedge count — higher = smoother hue transitions

    // --- One-time defs ---
    const defs = document.createElementNS(NS, 'defs');

    // White-to-transparent radial gradient. objectBoundingBox so it adapts to
    // any circle size: cx/cy 0.5 = bbox centre, r 0.5 = bbox half-width.
    const rg = document.createElementNS(NS, 'radialGradient');
    rg.setAttribute('id', 'wc');
    rg.setAttribute('cx', '0.5');
    rg.setAttribute('cy', '0.5');
    rg.setAttribute('r',  '0.5');
    rg.setAttribute('gradientUnits', 'objectBoundingBox');
    for (const [off, op] of [[0, 1], [0.4, 0.7], [1, 0]]) {
      const s = document.createElementNS(NS, 'stop');
      s.setAttribute('offset', off);
      s.setAttribute('stop-color', 'white');
      s.setAttribute('stop-opacity', op);
      rg.appendChild(s);
    }
    defs.appendChild(rg);

    svg.appendChild(defs);

    // --- Stamp ---
    // Each stamp is N pie-wedge paths (the rainbow) + one gradient circle (white centre),
    // all drawn directly at stamp coordinates so objectBoundingBox gradient is unambiguous.
    function placeStamp(cx, cy, pressure, twist) {
      const r    = STAMP_RADIUS * (0.35 + pressure * 1.3);
      const twRad = twist * Math.PI / 180;
      const rs   = r.toFixed(2);
      const g    = document.createElementNS(NS, 'g');
      g.setAttribute('opacity', '0.72');

      for (let i = 0; i < N; i++) {
        const a1 = (i / N) * Math.PI * 2 + twRad;
        const a2 = ((i + 1) / N) * Math.PI * 2 + twRad;
        const path = document.createElementNS(NS, 'path');
        path.setAttribute('d',
          `M${cx.toFixed(1)},${cy.toFixed(1)}` +
          ` L${(cx + r * Math.cos(a1)).toFixed(2)},${(cy + r * Math.sin(a1)).toFixed(2)}` +
          ` A${rs},${rs},0,0,1,${(cx + r * Math.cos(a2)).toFixed(2)},${(cy + r * Math.sin(a2)).toFixed(2)} Z`
        );
        path.setAttribute('fill', `hsl(${((i / N) * 360).toFixed(1)},100%,55%)`);
        g.appendChild(path);
      }

      const overlay = document.createElementNS(NS, 'circle');
      overlay.setAttribute('cx', cx.toFixed(1));
      overlay.setAttribute('cy', cy.toFixed(1));
      overlay.setAttribute('r',  rs);
      overlay.setAttribute('fill', 'url(#wc)');
      g.appendChild(overlay);

      svg.appendChild(g);
    }

    // --- Pointer events ---
    let drawing = false;
    let lx = 0, ly = 0, lp = 0.5, ltw = 0;

    svg.addEventListener('pointerdown', e => {
      drawing = true;
      svg.setPointerCapture(e.pointerId);
      lp = e.pressure || 0.5; ltw = e.twist ?? 0;
      placeStamp(e.clientX, e.clientY, lp, ltw);
      lx = e.clientX; ly = e.clientY;
    });

    svg.addEventListener('pointermove', e => {
      if (!drawing) return;
      for (const ev of (e.getCoalescedEvents?.() ?? [e])) {
        const p  = ev.pressure || 0.5;
        const tw = ev.twist ?? 0;
        hud.firstChild.textContent = `pressure: ${p.toFixed(3)}  twist: ${tw.toFixed(0)}°`;
        const dx = ev.clientX - lx, dy = ev.clientY - ly;
        if (dx * dx + dy * dy >= STEP * STEP) {
          // shortest-path twist delta to avoid wrap-around jumps
          let dtw = tw - ltw;
          if (dtw >  180) dtw -= 360;
          if (dtw < -180) dtw += 360;
          for (const t of [1/3, 2/3, 1]) {
            placeStamp(lx + dx * t, ly + dy * t, lp + (p - lp) * t, ltw + dtw * t);
          }
          lx = ev.clientX; ly = ev.clientY;
          lp = p; ltw = tw;
        }
      }
    });

    svg.addEventListener('pointerup',     () => { drawing = false; });
    svg.addEventListener('pointercancel', () => { drawing = false; });

    svg.addEventListener('dblclick', () => {
      for (const el of [...svg.children]) {
        if (el.tagName !== 'defs') svg.removeChild(el);
      }
    });
  </script>
</body>
</html>
