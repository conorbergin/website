<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>WebGPU Spacetime Pen</title>
        <style>
            html,
            body {
            }
            canvas {
                display: block;
                touch-action: none;
            }
        </style>
    </head>
    <body>
        <canvas width="800" height="400" id="c"></canvas>
        <canvas width="800" height="400" id="c1"></canvas>
        <script type="module">
            const canvas = document.getElementById("c");
            const canvas1 = document.getElementById("c1");

            const adapter = await navigator.gpu.requestAdapter();
            const device = await adapter.requestDevice();
            const context = canvas.getContext("webgpu");
            const context1 = canvas1.getContext("webgpu");
            const format = navigator.gpu.getPreferredCanvasFormat();
            context.configure({ device, format, alphaMode: "opaque" });
            context1.configure({ device, format, alphaMode: "opaque" });

            // Depth texture
            let depthTexture = device.createTexture({
                size: [canvas.width, canvas.height],
                format: "depth24plus",
                usage: GPUTextureUsage.RENDER_ATTACHMENT,
            });

            // Each pen sample: x, y, pressure, time
            // We'll accumulate segments: (x0,y0,r0,t0) -> (x1,y1,r1,t1)
            // Each segment is a skewed frustum (conical section) in 3D: x,y=screen, z=time
            // We generate a tube mesh between two circles

            const SIDES = 32; // sides of each tube segment

            // Shader
            const shaderSrc = /* wgsl */ `
struct Uniforms {
  viewProj: mat4x4<f32>,
}
@group(0) @binding(0) var<uniform> uni: Uniforms;

struct VertexOut {
  @builtin(position) pos: vec4<f32>,
  @location(0) angle: f32,
}

@vertex
fn vs(@location(0) position: vec3<f32>, @location(1) angle: f32) -> VertexOut {
  var out: VertexOut;
  out.pos = uni.viewProj * vec4<f32>(position, 1.0);
  out.angle = angle;
  return out;
}

@fragment
fn fs(in: VertexOut) -> @location(0) vec4<f32> {
  // fract wraps angle to [0,1) so hue is always in [0,6) with no seam
  let h = fract(in.angle / (2.0 * 3.14159265)) * 6.0;
  let i = floor(h);
  let f = h - i;
  let q = 1.0 - f;
  var rgb: vec3<f32>;
  if (i < 1.0) { rgb = vec3(1.0, f, 0.0); }
  else if (i < 2.0) { rgb = vec3(q, 1.0, 0.0); }
  else if (i < 3.0) { rgb = vec3(0.0, 1.0, f); }
  else if (i < 4.0) { rgb = vec3(0.0, q, 1.0); }
  else if (i < 5.0) { rgb = vec3(f, 0.0, 1.0); }
  else { rgb = vec3(1.0, 0.0, q); }
  return vec4<f32>(rgb, 1.0);
}
`;

            const shaderModule = device.createShaderModule({ code: shaderSrc });

            const pipeline = device.createRenderPipeline({
                layout: "auto",
                vertex: {
                    module: shaderModule,
                    entryPoint: "vs",
                    buffers: [
                        {
                            arrayStride: 16, // vec3 + float angle = 4*4
                            attributes: [
                                {
                                    shaderLocation: 0,
                                    offset: 0,
                                    format: "float32x3",
                                },
                                {
                                    shaderLocation: 1,
                                    offset: 12,
                                    format: "float32",
                                },
                            ],
                        },
                    ],
                },
                fragment: {
                    module: shaderModule,
                    entryPoint: "fs",
                    targets: [{ format }],
                },
                primitive: { topology: "triangle-list", cullMode: "none" },
                depthStencil: {
                    format: "depth24plus",
                    depthWriteEnabled: true,
                    depthCompare: "less",
                },
            });

            // Uniforms buffer
            const uniformBuffer = device.createBuffer({
                size: 64,
                usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
            });
            const bindGroup = device.createBindGroup({
                layout: pipeline.getBindGroupLayout(0),
                entries: [{ binding: 0, resource: { buffer: uniformBuffer } }],
            });

            // Orthographic projection: map screen pixels to NDC, z scaled
            function orthoMatrix(w, h, zNear, zFar) {
                // Maps x:[0,w] y:[0,h] z:[zNear,zFar] -> NDC
                const m = new Float32Array(16);
                m[0] = 2 / w;
                m[5] = -2 / h;
                m[10] = 1 / (zFar - zNear);
                m[12] = -1;
                m[13] = 1;
                m[14] = -zNear / (zFar - zNear);
                m[15] = 1;
                return m;
            }

            // Geometry buffer: we'll accumulate vertex data in a Float32Array
            // and upload each frame. Max segments.
            const MAX_VERTS = 1024 * 1024;
            const vertData = new Float32Array(MAX_VERTS * 4);
            let vertCount = 0;

            let gpuVertBuf = null;

            function ensureVertBuf() {
                if (gpuVertBuf) gpuVertBuf.destroy();
                if (vertCount === 0) {
                    gpuVertBuf = null;
                    return;
                }
                gpuVertBuf = device.createBuffer({
                    size: vertCount * 16,
                    usage: GPUBufferUsage.VERTEX | GPUBufferUsage.COPY_DST,
                    mappedAtCreation: true,
                });
                new Float32Array(gpuVertBuf.getMappedRange()).set(
                    vertData.subarray(0, vertCount * 4),
                );
                gpuVertBuf.unmap();
            }

            // Add a frustum segment between two circles
            // circle: {x, y, r, t}  -- t is the z (time) value
            function addSegment(c0, c1) {
                const n = SIDES;
                // Generate 2 rings of n verts, then triangulate the quad strip
                for (let i = 0; i < n; i++) {
                    const a0 = (i / n) * Math.PI * 2;
                    const a1 = ((i + 1) / n) * Math.PI * 2;

                    // quad: v00, v10, v01 and v10, v11, v01
                    const v = [
                        [
                            c0.x + Math.cos(a0) * c0.r,
                            c0.y + Math.sin(a0) * c0.r,
                            c0.t,
                            a0,
                        ],
                        [
                            c1.x + Math.cos(a0) * c1.r,
                            c1.y + Math.sin(a0) * c1.r,
                            c1.t,
                            a0,
                        ],
                        [
                            c0.x + Math.cos(a1) * c0.r,
                            c0.y + Math.sin(a1) * c0.r,
                            c0.t,
                            a1,
                        ],
                        [
                            c1.x + Math.cos(a1) * c1.r,
                            c1.y + Math.sin(a1) * c1.r,
                            c1.t,
                            a1,
                        ],
                    ];

                    // triangle 1: v[0], v[1], v[2]
                    // triangle 2: v[1], v[3], v[2]
                    for (const idx of [0, 1, 2, 1, 3, 2]) {
                        if (vertCount >= MAX_VERTS) return;
                        const base = vertCount * 4;
                        vertData[base + 0] = v[idx][0];
                        vertData[base + 1] = v[idx][1];
                        vertData[base + 2] = v[idx][2];
                        vertData[base + 3] = v[idx][3];
                        vertCount++;
                    }
                }
            }

            // Pen input state
            let currentStroke = null; // last sample {x,y,r,t}
            let startTime = null;
            const TIME_SCALE = 200; // pixels of z per second

            canvas.addEventListener("pointerdown", (e) => {
                if (!startTime) startTime = performance.now();
                const t = ((performance.now() - startTime) / 1000) * TIME_SCALE;
                currentStroke = {
                    x: e.offsetX,
                    y: e.offsetY,
                    r: Math.max(4, e.pressure * 80),
                    t,
                };
            });

            canvas.addEventListener("pointermove", (e) => {
                if (e.buttons === 0) return;
                if (!startTime) startTime = performance.now();
                const t = ((performance.now() - startTime) / 1000) * TIME_SCALE;
                const next = {
                    x: e.offsetX,
                    y: e.offsetY,
                    r: Math.max(4, e.pressure * 80),
                    t,
                };
                if (currentStroke) {
                    addSegment(currentStroke, next);
                    dirty = true;
                }
                currentStroke = next;
            });

            canvas.addEventListener("pointerup", () => {
                currentStroke = null;
            });
            canvas.addEventListener("pointercancel", () => {
                currentStroke = null;
            });

            let dirty = false;

            function frame() {
                if (dirty) {
                    ensureVertBuf();
                    dirty = false;
                }

                const zCurrent = startTime
                    ? ((performance.now() - startTime) / 1000) * TIME_SCALE
                    : 0;
                // Show all strokes from t=0 to now. Reversed z keeps new strokes on top.
                const zNear = zCurrent + 100;
                const zFar = -100;

                const mat = orthoMatrix(
                    canvas.width,
                    canvas.height,
                    zNear,
                    zFar,
                );
                device.queue.writeBuffer(uniformBuffer, 0, mat);

                const encoder = device.createCommandEncoder();
                const pass = encoder.beginRenderPass({
                    colorAttachments: [
                        {
                            view: context.getCurrentTexture().createView(),
                            clearValue: { r: 0.05, g: 0.05, b: 0.05, a: 1 },
                            loadOp: "clear",
                            storeOp: "store",
                        },
                    ],
                    depthStencilAttachment: {
                        view: depthTexture.createView(),
                        depthClearValue: 1.0,
                        depthLoadOp: "clear",
                        depthStoreOp: "store",
                    },
                });

                pass.setPipeline(pipeline);
                pass.setBindGroup(0, bindGroup);

                if (gpuVertBuf && vertCount > 0) {
                    pass.setVertexBuffer(0, gpuVertBuf);
                    pass.draw(vertCount);
                }

                pass.end();
                device.queue.submit([encoder.finish()]);
                requestAnimationFrame(frame);
            }

            requestAnimationFrame(frame);
        </script>
    </body>
</html>
