<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>WebGPU Brush</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path d='M8 28C8 20 14 12 16 16C18 20 24 12 24 4' stroke='%231a1a1a' stroke-width='4.5' fill='none' stroke-linecap='round'/></svg>">
<style>
* { box-sizing: border-box; margin: 0; }
body { background: #ccc; font: 13px/1.5 monospace; }
#wrap { width: 800px; margin: 16px auto; }
#controls { display: flex; align-items: center; gap: 12px; padding: 6px 2px; }
button { padding: 2px 10px; cursor: pointer; }
canvas { display: block; touch-action: none; cursor: crosshair; outline: 1px solid #888; }
#info { margin-left: auto; color: #555; }
</style>
</head>
<body>
<div id="wrap">
  <div id="controls">
    <button id="btn-clear">Clear</button>
    <button id="btn-stress">+ Stress</button>
    <label><input type="radio" name="pipeline" value="tess" checked> Tessellated</label>
    <label><input type="radio" name="pipeline" value="sdf"> SDF r₀</label>
    <label><input type="radio" name="pipeline" value="sdf-cone"> SDF Cone</label>
    <label><input type="radio" name="pipeline" value="sdf-lerp"> SDF Lerp</label>
    <input type="color" id="color" value="#111111" title="Brush color">
    <span>size <input type="range" id="size" min="2" max="48" value="16" style="width:72px"> <span id="size-val">16</span></span>
    <span id="info"></span>
  </div>
  <canvas id="canvas"></canvas>
</div>
<script src="./index.js"></script>
</body>
</html>
